name: Release APK
on:
  push:
    branches: [main, master, claude/happy-clarke-2z7mos]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)-${{ github.run_number }}" >> $GITHUB_ENV
      - run: flutter pub get
      - name: Chave de assinatura
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure o secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk compras-v${{ env.VERSION }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: compras-v${{ env.VERSION }}.apk
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

name: Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
# contents: write só porque o último passo cria a release
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Ações fixadas por SHA (o comentário diz a versão): uma tag movida para
      # um commit malicioso não roda aqui com acesso à chave de assinatura.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false } # o token não fica no .git/config
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable, cache: true }
      - run: echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)-${{ github.run_number }}" >> $GITHUB_ENV
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Chave de assinatura
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure o secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} --dart-define=VERSAO=${{ env.VERSION }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: Apagar a chave de assinatura
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - run: mv build/app/outputs/flutter-apk/app-release.apk mesquevem-v${{ env.VERSION }}.apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: mesquevem-v${{ env.VERSION }}.apk
          tag_name: v${{ env.VERSION }}
          name: Mês que Vem v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

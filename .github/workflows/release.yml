name: Release APK
on:
  push:
    branches: [main, master, claude/happy-clarke-2z7mos]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)-${{ github.run_number }}" >> $GITHUB_ENV
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk compras-v${{ env.VERSION }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: compras-v${{ env.VERSION }}.apk
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
